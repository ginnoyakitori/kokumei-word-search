<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シークワーズ生成</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f7f9;
      color: #222;
    }

    h1 {
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      font-weight: bold;
    }

    select, input, button {
      padding: 8px 12px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin: 12px 0;
      font-weight: bold;
    }

    .result-section {
      margin-top: 20px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .stat-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px;
    }

    .stat-label {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #1d4ed8;
    }

    #grid {
      display: inline-grid;
      gap: 2px;
      margin-top: 12px;
    }

    .cell {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      font-weight: bold;
      border-radius: 4px;
      user-select: none;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .word-chip {
      padding: 6px 10px;
      background: #e5e7eb;
      border-radius: 999px;
      font-size: 14px;
    }

    .meta {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      text-align: center;
    }

    th {
      background: #f3f4f6;
    }

    .table-wrap {
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>シークワーズ生成</h1>

  <div class="controls">
    <div>
      <label for="wordType">単語リスト</label><br />
      <select id="wordType">
        <option value="countries">国名</option>
        <option value="capitals">首都名</option>
        <option value="pokemon">ポケモン</option>
      </select>
    </div>

    <div>
      <label for="gridSize">盤面サイズ</label><br />
      <input id="gridSize" type="number" min="5" max="30" value="15" />
    </div>

    <div>
      <button id="generateBtn">生成する</button>
    </div>
  </div>

  <div id="status"></div>

  <div class="result-section">
    <div class="card">
      <h2>統計</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">使われた単語数</div>
          <div id="placedWordCount" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">使われた単語の合計文字数</div>
          <div id="totalPlacedChars" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">盤面サイズ</div>
          <div id="boardSizeValue" class="stat-value">0×0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>盤面</h2>
      <div class="meta">文字列は縦・横・斜めの8方向に入ります。</div>
      <div id="grid"></div>
    </div>

    <div class="card">
      <h2>使われた単語</h2>
      <div id="placedWords" class="word-list"></div>
    </div>

    <div class="card">
  <h2>各座標の文字が何個の単語に使われているか</h2>
  <div class="meta">
    各マスの数字は、その座標の文字がいくつの単語に使われているかを表します。
    ランダムで埋められた文字は 0 です。
  </div>
  <div id="usageGrid"></div>
</div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
``
